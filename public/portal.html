<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EthixWeb CRM — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=20260717a">
</head>
<body>
<div class="ew" data-theme="light" id="ewRoot">
  <div class="ew-ambient">
    <img class="ew-watermark-web ew-watermark-web-tl" src="/assets/spiderweb.svg" alt="" aria-hidden="true">
    <img class="ew-watermark-web ew-watermark-web-br" src="/assets/spiderweb.svg" alt="" aria-hidden="true">
  </div>

  <div class="ew-shell">
    <aside class="ew-sidebar">
      <div class="ew-brand">
        <div class="ew-brand-mark"><img src="/assets/emblem-mark.png" alt="EthixWeb"></div>
        <div>
          <div class="ew-brand-name">EthixWeb CRM</div>
          <div class="ew-brand-sub">Internal Operations</div>
        </div>
      </div>

      <nav class="ew-nav" id="sideNav"></nav>

      <div class="ew-sidebar-footer">
        <div class="ew-plan-card">
          <div class="t" id="navUserName">—</div>
          <div class="d" id="navUserRole">—</div>
        </div>
        <button class="ew-logout-btn" id="logoutBtn">Log out</button>
      </div>
    </aside>

    <main class="ew-main">
      <div class="ew-topbar">
        <div>
          <div class="ew-eyebrow">Portal</div>
          <div class="ew-title" id="pageTitle">Dashboard</div>
        </div>
        <div class="ew-topbar-right">
          <div class="ew-toggle">
            <button id="darkBtn" aria-label="Dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
            <button id="lightBtn" class="active" aria-label="Light mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.2M12 19.8V22M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2 12h2.2M19.8 12H22M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg></button>
          </div>
          <div class="ew-bell-wrap" id="bellWrap">
            <button class="ew-bell-btn" id="bellBtn" aria-label="Notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
              <span class="ew-bell-badge ew-hidden" id="bellBadge">0</span>
            </button>
            <div class="ew-bell-panel ew-hidden" id="bellPanel"></div>
          </div>
          <div class="ew-avatar-wrap" id="avatarWrap">
            <button class="ew-avatar-btn" id="avatarBtn">--</button>
            <div class="ew-avatar-menu ew-hidden" id="avatarMenu"></div>
          </div>
        </div>
      </div>

      <div id="mainContent"><div class="ew-loading">Loading…</div></div>
    </main>
  </div>

  <div id="toastHost"></div>
</div>

<script src="/app.js?v=20260717a"></script>
<script src="/accessibility.js?v=20260717a"></script>
</body>
</html>

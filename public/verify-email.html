<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifying — EthixWeb CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=20260717a">
</head>
<body>
<div class="ew" data-theme="light">
  <div class="ew-ambient"></div>
  <div class="ew-login-shell">
    <div class="ew-card ew-login-card" style="text-align:center">
      <div class="ew-login-title serif" id="statusTitle">Verifying your email…</div>
      <p class="ew-login-sub" id="statusMsg">Hang tight, this only takes a second.</p>
      <a href="/index.html" class="ew-btn ew-btn-ghost ew-btn-block" style="margin-top:16px">Back to sign in</a>
    </div>
  </div>
</div>
<script src="/firebase2fa.js?v=20260717a" type="module"></script>
<script>
(async () => {
  try {
    const configRes = await fetch('/api/config');
    const config = await configRes.json();
    if (!config.firebaseEnabled) throw new Error('Firebase is not configured on this server.');

    await window.EWFirebase2FA.loadFirebase(config.firebaseConfig);
    const firebaseIdToken = await window.EWFirebase2FA.completeEmailSignIn();

    // Two possible reasons this page loads: confirming a *login* 2FA step,
    // or confirming a *new 2FA enrollment* from Settings. Try login-verify
    // first (it's harmless if there's no pending session).
    const csrfToken = sessionStorage.getItem('ew_pending_csrf');
    let res = await fetch('/api/auth/verify-2fa', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken || '' },
      body: JSON.stringify({ firebaseIdToken }),
    });

    if (res.ok) {
      const data = await res.json();
      document.getElementById('statusTitle').textContent = 'Verified!';
      document.getElementById('statusMsg').textContent = 'Redirecting you now…';
      setTimeout(() => { window.location.href = data.redirect || '/portal.html'; }, 800);
      return;
    }

    // Fall back to "enabling 2FA from Settings" flow.
    const meRes = await fetch('/api/auth/me', { credentials: 'same-origin' });
    if (!meRes.ok) throw new Error('Please sign in first, then try enabling 2FA again.');
    const me = await meRes.json();
    const enableRes = await fetch('/api/users/me/2fa/enable', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': me.csrfToken },
      body: JSON.stringify({ firebaseIdToken }),
    });
    if (!enableRes.ok) {
      const data = await enableRes.json().catch(() => ({}));
      throw new Error(data.error || 'Could not enable two-factor authentication.');
    }
    document.getElementById('statusTitle').textContent = 'Two-factor authentication enabled!';
    document.getElementById('statusMsg').textContent = 'Redirecting you to your portal…';
    setTimeout(() => { window.location.href = '/portal.html'; }, 1200);
  } catch (err) {
    document.getElementById('statusTitle').textContent = 'Verification failed';
    document.getElementById('statusMsg').textContent = err.message || 'Something went wrong.';
  }
})();
</script>
</body>
</html>
